# Ultra Stick 120 (FASER, University of Minnesota UAV Lab) - base aircraft of the ground-truth simulator.
# Transcribed from UMNUAV_sim_v4 (BSD, (c) 2011 Regents of the University of Minnesota):
#   Simulation/Libraries/FASER_config.m, Propulsion_Lib.mdl, Actuator_Lib.mdl, FASER_Aero_Lib.mdl.
# Aero: NASA Langley wind-tunnel tables, FASER_Aero.mat (fetched by scripts/fetch_umn.sh).
# SI units, radians unless stated otherwise.

aircraft: ultrastick120
aero_model: faser_tables
aero_file: third_party/umn/FASER_Aero.mat

mass: 6.804                    # kg, FASER_config.m (15 lb, avionics included)
Ixx: 0.672485702               # kg m2
Iyy: 0.889416574
Izz: 1.57817209
Ixz: -0.759258051              # inertia matrix [[Ixx 0 -Ixz] [0 Iyy 0] [-Ixz 0 Izz]] (UMN convention)
c: 0.433578                    # m, mean chord
b: 1.917192                    # m
S: 0.769237171                 # m2
# CG = aerodynamic center (quarter chord) and thrust along the x axis: no pitch lever arm.

# propulsion (FASER_config.m; the Simulink library hard-codes the 25e polynomials,
# we follow the values declared for FASER: radius 0.1778 m and power x6)
prop_radius: 0.1778            # m
prop_CT: [-0.4314, 1.08, -0.896, 0.1089, 0.0604]      # polynomial in J, decreasing order (polyval)
prop_CP: [0.5054, -0.5304, 0.0412, 0.01664, 0.0223]
motor_power: [1046.76, 420.81, -26.34]               # W, throttle polynomial (= [174.46 70.135 -4.39] x 6)
motor_power_max: 1900.0        # W, ThrottleOutputLimit.Upper
omega_max: 1570.796            # rad/s (15,000 rpm)
omega_min: 1.0
Jmp: 0.00012991                # kg m2, motor + propeller

# control surfaces [elevator, ailerons, rudder]: first order w/(s+w), w = 2 pi BW, rate and deflection
# limited (Actuator_Lib.mdl). UMN conventions: elevator +TED (nose down), ailerons (da_r - da_l)/2 +TED,
# rudder +TEL.
act_bw_hz: 8.0
act_rate_max: 2.618            # rad/s (150 deg/s)
act_max: [0.4363, 0.4363, 0.4363]     # rad (25 deg)
act_min: [-0.4363, -0.4363, -0.4363]

# effect of the propeller slipstream on the tables (advance ratio J):
#   "actual"  : J computed from the propeller speed (used to generate the data)
#   "umn_v4"  : as in UMNUAV_sim_v4 (constant 1, saturated at the table maximum, 0.7)
j_mode: actual

g: 9.80665
