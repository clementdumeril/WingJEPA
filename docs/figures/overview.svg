<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="608" viewBox="0 0 1200 608" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="606" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>

  <!-- zones -->
  <g fill="none" stroke="#8A9AA8" stroke-width="1.2" stroke-dasharray="6 4">
    <rect x="24" y="24" width="256" height="396" rx="10"/>
    <rect x="304" y="24" width="572" height="396" rx="10"/>
    <rect x="900" y="24" width="276" height="396" rx="10"/>
  </g>
  <g font-size="15" fill="#5A6875" letter-spacing="1.5">
    <text x="40" y="48">DATA</text>
    <text x="320" y="48">WORLD MODEL · 22K PARAMETERS</text>
    <text x="916" y="48">OPEN-LOOP PREDICTION</text>
  </g>

  <!-- DATA -->
  <rect x="40" y="64" width="224" height="80" rx="10" fill="#FBE5CF" stroke="#C97A2B" stroke-width="1.5"/>
  <text x="152" y="98" font-size="21" text-anchor="middle" fill="#15202A">Commands + wind</text>
  <text x="152" y="124" font-size="16" text-anchor="middle" fill="#5A6875">4 + 3 per future step</text>

  <rect x="40" y="184" width="224" height="88" rx="10" fill="#FBE5CF" stroke="#C97A2B" stroke-width="1.5"/>
  <text x="152" y="218" font-size="21" text-anchor="middle" fill="#15202A">Past 2 s of states</text>
  <text x="152" y="246" font-size="16" text-anchor="middle" fill="#5A6875">40 x 9 at 20 Hz, + m, I</text>

  <image href="overview/validation.png" x="40" y="292" width="224" height="99"/>
  <rect x="40" y="292" width="224" height="99" rx="6" fill="none" stroke="#B8C2CC"/>
  <text x="152" y="410" font-size="15" text-anchor="middle" fill="#5A6875">6-DoF simulator vs UMN reference</text>

  <!-- WORLD MODEL -->
  <rect x="320" y="184" width="156" height="88" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="1.5"/>
  <text x="398" y="218" font-size="21" text-anchor="middle" fill="#15202A">TCN encoder</text>
  <text x="398" y="246" font-size="16" text-anchor="middle" fill="#5A6875">causal, sees 2 s</text>

  <rect x="528" y="184" width="156" height="88" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="1.5"/>
  <text x="606" y="218" font-size="21" text-anchor="middle" fill="#15202A">GRU predictor</text>
  <text x="606" y="248" font-size="17" text-anchor="middle" fill="#5A6875" font-family="Georgia, 'Times New Roman', serif" font-style="italic">z<tspan font-size="12" dy="4">k</tspan><tspan dy="-4"> → z</tspan><tspan font-size="12" dy="4">k+1</tspan></text>

  <rect x="716" y="72" width="144" height="80" rx="10" fill="#F1F4F6" stroke="#8A9AA8" stroke-width="1.5"/>
  <text x="788" y="106" font-size="20" text-anchor="middle" fill="#15202A">MLP decoder</text>
  <text x="788" y="132" font-size="16" text-anchor="middle" fill="#5A6875">models A, A0</text>

  <rect x="716" y="184" width="144" height="124" rx="10" fill="#DCF1EE" stroke="#0D7A6F" stroke-width="1.5"/>
  <text x="788" y="216" font-size="20" text-anchor="middle" fill="#15202A">Physics head</text>
  <text x="788" y="242" font-size="16" text-anchor="middle" fill="#5A6875">Newton-Euler</text>
  <text x="788" y="264" font-size="16" text-anchor="middle" fill="#5A6875">RK4, true m, I</text>
  <text x="788" y="292" font-size="17" text-anchor="middle" fill="#0D7A6F" font-family="Georgia, 'Times New Roman', serif" font-style="italic">F<tspan font-size="12" dy="4">prior</tspan><tspan dy="-4"> + ΔF(z)</tspan></text>

  <!-- training loss (dashed sub-box) -->
  <rect x="320" y="328" width="364" height="76" rx="10" fill="none" stroke="#1F5FBF" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="336" y="358" font-size="16" fill="#15202A"><tspan font-weight="bold">JEPA:</tspan> predict the target latent + SIGReg</text>
  <text x="336" y="384" font-size="16" fill="#15202A"><tspan font-weight="bold">Direct:</tspan> error on the predicted states</text>

  <!-- arrows -->
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M264,228 H318"/>
    <path d="M476,228 H526"/>
    <path d="M264,104 H606 V182"/>
    <path d="M684,228 H714"/>
    <path d="M700,228 V112 H714"/>
    <path d="M584,272 C584,316 628,316 628,274"/>
    <path d="M860,112 H910"/>
    <path d="M860,246 H910"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#15202A" font-size="18">
    <text x="501" y="218" text-anchor="middle">z<tspan font-size="13" dy="4" font-style="normal" font-family="Arial, Helvetica, sans-serif">0</tspan></text>
    <text x="436" y="94" text-anchor="middle">u<tspan font-size="12" dy="4">k</tspan></text>
    <text x="886" y="102" text-anchor="middle">x<tspan font-size="12" dy="4">k</tspan></text>
    <text x="886" y="236" text-anchor="middle">x<tspan font-size="12" dy="4">k</tspan></text>
  </g>
  <text x="574" y="306" font-size="15" text-anchor="end" fill="#5A6875">up to 60 s</text>

  <!-- OUTPUT -->
  <image href="overview/paths_calm.png" x="912" y="60" width="252" height="205"/>
  <rect x="912" y="60" width="252" height="205" rx="6" fill="none" stroke="#B8C2CC"/>
  <text x="1038" y="324" font-size="42" font-weight="bold" text-anchor="middle" fill="#B8461F">11.4 s</text>
  <text x="1038" y="352" font-size="16" text-anchor="middle" fill="#15202A">useful horizon, physics head</text>
  <text x="1038" y="376" font-size="16" text-anchor="middle" fill="#5A6875">9.6 s direct, 1.9 s JEPA</text>
  <text x="1038" y="400" font-size="15" text-anchor="middle" fill="#5A6875">calm air, held-out flights, 3 seeds</text>

  <!-- FINDINGS band -->
  <text x="40" y="462" font-size="15" fill="#5A6875" letter-spacing="1.5">FINDINGS</text>
  <line x1="24" y1="444" x2="1176" y2="444" stroke="#D0D7DE"/>

  <image href="overview/horizon.png" x="40" y="480" width="168" height="102"/>
  <rect x="40" y="480" width="168" height="102" rx="6" fill="none" stroke="#B8C2CC"/>
  <text x="224" y="508" font-size="28" font-weight="bold" fill="#15202A">+20 %</text>
  <text x="224" y="536" font-size="16" fill="#15202A">physics head vs direct,</text>
  <text x="224" y="558" font-size="16" fill="#5A6875">calm air; no gain in</text>
  <text x="224" y="580" font-size="16" fill="#5A6875">turbulence</text>

  <image href="overview/probe.png" x="424" y="500" width="168" height="63"/>
  <rect x="424" y="500" width="168" height="63" rx="6" fill="none" stroke="#B8C2CC"/>
  <text x="608" y="508" font-size="28" font-weight="bold" fill="#15202A">0.82</text>
  <text x="608" y="536" font-size="16" fill="#15202A">pitch-rate probe error</text>
  <text x="608" y="558" font-size="16" fill="#5A6875">from the JEPA latent</text>
  <text x="608" y="580" font-size="16" fill="#5A6875">(A0 latent: 0.03)</text>

  <image href="overview/rollout_bank.png" x="808" y="499" width="168" height="64"/>
  <rect x="808" y="499" width="168" height="64" rx="6" fill="none" stroke="#B8C2CC"/>
  <text x="992" y="508" font-size="28" font-weight="bold" fill="#15202A">2.9 s</text>
  <text x="992" y="536" font-size="16" fill="#15202A">best, extreme aircraft</text>
  <text x="992" y="558" font-size="16" fill="#5A6875">(mass, inertia out of</text>
  <text x="992" y="580" font-size="16" fill="#5A6875">range); baseline 2.1 s</text>
</svg>
