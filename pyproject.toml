[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wingjepa"
version = "0.0.1"
description = "JEPA-style latent world models for fixed-wing flight under model misspecification"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "jsbsim>=1.3", "torch", "pyyaml", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["wingjepa*"]
